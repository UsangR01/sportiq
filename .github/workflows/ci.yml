name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportiq_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sportiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    # app/core/config.py defaults database_url/redis_url to exactly what the services below
    # expose, so those need no override — but jwt_secret_key defaults to "", and PyJWT
    # (unlike some JWT libs) hard-rejects an empty HMAC key rather than just being insecure
    # about it. Confirmed live: every auth-touching test failed in CI with
    # `InvalidKeyError: HMAC key must not be empty` despite passing locally, since local dev
    # always has a real (if dummy) value in the gitignored backend/.env. A real deployment
    # would set this via a secrets manager per TDD §4.3/§7 — this is CI's equivalent.
    env:
      JWT_SECRET_KEY: ci-only-test-secret-not-a-real-credential
    steps:
      - uses: actions/checkout@v4

      # Matches the real local dev venv (py -3.11), a deliberate, tracked mismatch from the
      # TDD/Dockerfile's Python 3.12 target — see CLAUDE.md.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: alembic upgrade head

      - run: ruff check .
      - run: black --check .
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Jest/ESLint aren't configured yet (see CLAUDE.md "Not yet configured") — typecheck is
      # the only real, currently-meaningful check for mobile/.
      - run: npx tsc --noEmit
