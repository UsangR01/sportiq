name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportiq_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sportiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Matches the real local dev venv (py -3.11), a deliberate, tracked mismatch from the
      # TDD/Dockerfile's Python 3.12 target — see CLAUDE.md.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Settings default to these exact credentials/ports (app/core/config.py), which is
      # also what the services above expose — no env vars need setting for CI.
      - run: alembic upgrade head

      - run: ruff check .
      - run: black --check .
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Jest/ESLint aren't configured yet (see CLAUDE.md "Not yet configured") — typecheck is
      # the only real, currently-meaningful check for mobile/.
      - run: npx tsc --noEmit
