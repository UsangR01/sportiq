services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sportiq_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sportiq
    ports:
      - "5432:5432"
    volumes:
      - sportiq_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  sportiq_postgres_data:
